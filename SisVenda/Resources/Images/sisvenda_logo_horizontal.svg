<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="150" fill="white"/>

  <!-- Logo Icon Section -->
  <g>
    <!-- Background Circle for Logo -->
    <circle cx="75" cy="75" r="60" fill="#F0F7FF" stroke="#2563EB" stroke-width="2"/>

    <!-- Bar Chart Bars -->
    <rect x="45" y="95" width="15" height="35" fill="#2563EB" rx="2"/>
    <rect x="65" y="80" width="15" height="50" fill="#3B82F6" rx="2"/>
    <rect x="85" y="65" width="15" height="65" fill="#60A5FA" rx="2"/>
    <rect x="105" y="77" width="15" height="53" fill="#3B82F6" rx="2"/>

    <!-- Upward Arrow -->
    <line x1="125" y1="100" x2="135" y2="60" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="135,60 131,68 139,65" fill="#22C55E"/>
  </g>

  <!-- Text Section -->
  <g>
    <!-- Main Title -->
    <text x="160" y="55" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          fill="#2563EB">SisVenda</text>

    <!-- Subtitle -->
    <text x="160" y="95" font-family="Arial, sans-serif" font-size="20" 
          fill="#666666">Sistema de Vendas Inteligente</text>

    <!-- Accent Line -->
    <line x1="160" y1="110" x2="400" y2="110" stroke="#2563EB" stroke-width="2"/>
  </g>
</svg>
